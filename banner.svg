<svg width="1200" height="400" viewBox="0 0 1200 400"
fill="none" xmlns="http://www.w3.org/2000/svg"
role="img" aria-labelledby="title desc">

<title id="title">Anul Methnula Business Analyst Profile Banner</title>
<desc id="desc">
Animated cyber-style GitHub banner for Anul Methnula,
focused on Business Analysis, Project Management and Information Systems.
</desc>

<defs>

<!-- Background -->
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400"
gradientUnits="userSpaceOnUse">
<stop stop-color="#050816"/>
<stop offset=".48" stop-color="#0A1230"/>
<stop offset="1" stop-color="#071A31"/>
</linearGradient>

<!-- Neon Accent -->
<linearGradient id="accent" x1="100" y1="40"
x2="1110" y2="360" gradientUnits="userSpaceOnUse">
<stop stop-color="#22D3EE"/>
<stop offset=".48" stop-color="#60A5FA"/>
<stop offset="1" stop-color="#A855F7"/>
</linearGradient>

<!-- Cyan Glow -->
<radialGradient id="glowC" cx="0" cy="0" r="1"
gradientTransform="translate(965 172) rotate(160) scale(300 220)"
gradientUnits="userSpaceOnUse">
<stop stop-color="#22D3EE" stop-opacity=".26"/>
<stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
</radialGradient>

<!-- Purple Glow -->
<radialGradient id="glowP" cx="0" cy="0" r="1"
gradientTransform="translate(790 330) rotate(10) scale(330 190)"
gradientUnits="userSpaceOnUse">
<stop stop-color="#A855F7" stop-opacity=".18"/>
<stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
</radialGradient>

<!-- Grid -->
<pattern id="grid" width="34" height="34"
patternUnits="userSpaceOnUse">
<path d="M34 0H0V34"
fill="none"
stroke="#8BD5FF"
stroke-opacity=".065"/>
</pattern>

<!-- Glow -->
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
<feGaussianBlur stdDeviation="7" result="b"/>
<feMerge>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<!-- Clip -->
<clipPath id="panelClip">
<rect x="22" y="22" width="1156" height="356" rx="24"/>
</clipPath>

<style>

.mono{
font-family:Consolas,"Courier New",monospace
}

.sans{
font-family:"Segoe UI",Arial,sans-serif
}

.pulse{
animation:pulse 2.4s ease-in-out infinite;
transform-box:fill-box;
transform-origin:center
}

.pulse2{
animation:pulse 2.4s ease-in-out .7s infinite;
transform-box:fill-box;
transform-origin:center
}

.floatA{
animation:floatA 5.8s ease-in-out infinite
}

.floatB{
animation:floatB 6.8s ease-in-out infinite
}

.dash{
stroke-dasharray:12 16;
animation:dash 13s linear infinite
}

.scan{
animation:scan 5.8s linear infinite
}

.blink{
animation:blink 1.1s steps(2,end) infinite
}

.bar1{
animation:bar 3.8s ease-in-out infinite;
transform-box:fill-box;
transform-origin:left center
}

.bar2{
animation:bar 4.6s ease-in-out .4s infinite;
transform-box:fill-box;
transform-origin:left center
}

.bar3{
animation:bar 4.2s ease-in-out .8s infinite;
transform-box:fill-box;
transform-origin:left center
}

@keyframes pulse{
0%,100%{opacity:.45;transform:scale(.82)}
50%{opacity:1;transform:scale(1.18)}
}

@keyframes floatA{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

@keyframes floatB{
0%,100%{transform:translate(0,0)}
50%{transform:translate(7px,-8px)}
}

@keyframes dash{
to{stroke-dashoffset:-280}
}

@keyframes scan{
0%{transform:translateX(-360px);opacity:0}
12%{opacity:.55}
88%{opacity:.55}
100%{transform:translateX(1290px);opacity:0}
}

@keyframes blink{
50%{opacity:0}
}

@keyframes bar{
0%,100%{transform:scaleX(.45)}
50%{transform:scaleX(1)}
}

@media (prefers-reduced-motion:reduce){
*{animation:none!important}
}

</style>

</defs>


