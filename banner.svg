<svg width="1200" height="400" viewBox="0 0 1200 400"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#0b0920"/>
      <stop offset="100%" stop-color="#020208"/>
    </linearGradient>

    <!-- Neon gradient -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#6d28d9"
            stroke-width="0.5"
            opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid -->
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Decorative glow circles -->
  <circle cx="1050" cy="70" r="120"
          fill="#7c3aed" opacity="0.08"/>
  <circle cx="1100" cy="330" r="160"
          fill="#00d9ff" opacity="0.05"/>

  <!-- Top neon line -->
  <line x1="60" y1="45" x2="1140" y2="45"
        stroke="url(#neon)"
        stroke-width="2"
        filter="url(#glow)"/>

  <!-- Small status -->
  <circle cx="75" cy="85" r="5"
          fill="#00ff9d"
          filter="url(#glow)"/>

  <text x="90" y="91"
        fill="#00ff9d"
        font-family="monospace"
        font-size="14"
        letter-spacing="3">
    SYSTEM ONLINE
  </text>

  <!-- Main name -->
  <text x="60" y="165"
        fill="white"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="4">
    ANUL METHNULA
  </text>

  <!-- Underline -->
  <rect x="62" y="185"
        width="520"
        height="3"
        rx="2"
        fill="url(#neon)"
        filter="url(#glow)"/>

  <!-- Role -->
  <text x="62" y="230"
        fill="#b9b5d8"
        font-family="monospace"
        font-size="19"
        letter-spacing="3">
    BUSINESS ANALYST
  </text>

  <text x="62" y="265"
        fill="#7dd3fc"
        font-family="monospace"
        font-size="16"
        letter-spacing="2">
    INFORMATION SYSTEMS • SOFTWARE • TECHNOLOGY
  </text>

  <!-- Skills -->
  <text x="62" y="320"
        fill="#8b5cf6"
        font-family="monospace"
        font-size="15">
    [ REQUIREMENTS ]  [ AGILE ]  [ UML ]  [ BPMN ]  [ SQL ]
  </text>

  <!-- Right side code decoration -->
  <g font-family="monospace" font-size="15"
     fill="#64748b" opacity="0.8">

    <text x="790" y="105">{</text>
    <text x="815" y="135">"role": "BA",</text>
    <text x="815" y="165">"focus": "IT",</text>
    <text x="815" y="195">"mindset": "BUILD",</text>
    <text x="815" y="225">"status": "ONLINE"</text>
    <text x="790" y="255">}</text>

  </g>

  <!-- Neon vertical line -->
  <line x1="760" y1="90" x2="760" y2="280"
        stroke="url(#neon)"
        stroke-width="2"
        filter="url(#glow)"/>

  <!-- Bottom line -->
  <line x1="60" y1="355" x2="1140" y2="355"
        stroke="#312e81"
        stroke-width="1"/>

  <!-- Footer -->
  <text x="60" y="380"
        fill="#64748b"
        font-family="monospace"
        font-size="12"
        letter-spacing="2">
    TURNING BUSINESS PROBLEMS INTO DIGITAL SOLUTIONS
  </text>

  <!-- Animated-looking scanning dot -->
  <circle cx="1110" cy="355" r="4"
          fill="#00d9ff"
          filter="url(#glow)">
    <animate attributeName="opacity"
             values="1;0.2;1"
             dur="1.5s"
             repeatCount="indefinite"/>
  </circle>

</svg>
