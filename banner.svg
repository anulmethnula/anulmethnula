<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Anul Methnula — Business Analysis and Project Management</title>
  <desc id="desc">Dark animated GitHub profile banner focused on business analysis, project management, Agile, requirements, stakeholders and digital transformation.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070A0F"/>
      <stop offset="0.55" stop-color="#0B111A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#64748B" stroke-opacity="0.06"/>
    </pattern>

  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="1198" height="398" rx="28" fill="url(#bg)" stroke="#263241" stroke-width="2"/>
  <rect x="22" y="22" width="1156" height="356" rx="24" fill="url(#grid)"/>

  <!-- subtle moving glow -->
  <circle cx="980" cy="95" r="130" fill="#2DD4BF" opacity="0.05">
    <animate attributeName="opacity" values="0.03;0.08;0.03" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="330" r="170" fill="#8B5CF6" opacity="0.04">
    <animate attributeName="opacity" values="0.02;0.07;0.02" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Top bar -->
  <circle cx="58" cy="54" r="5" fill="#2DD4BF"/>
  <circle cx="78" cy="54" r="5" fill="#3B82F6"/>
  <circle cx="98" cy="54" r="5" fill="#8B5CF6"/>
  <text x="122" y="59" fill="#94A3B8" font-size="12" font-family="Consolas, monospace" letter-spacing="2">PROFILE://ANUL.METHNULA</text>
  <text x="1090" y="59" fill="#94A3B8" font-size="11" font-family="Consolas, monospace" text-anchor="end">PROJECT MODE</text>
  <circle cx="1110" cy="55" r="5" fill="#22C55E">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1122" y="59" fill="#86EFAC" font-size="11" font-family="Consolas, monospace">ACTIVE</text>
  <path d="M42 85H1158" stroke="#263241" stroke-opacity="0.85"/>

  <!-- Left content -->
  <g transform="translate(62 120)">
    <text x="0" y="0" fill="#2DD4BF" font-size="13" font-family="Consolas, monospace" letter-spacing="4">FROM BUSINESS NEED TO DELIVERED VALUE</text>

    <text x="0" y="66" fill="#F8FAFC" font-size="56" font-weight="800" font-family="Segoe UI, Arial, sans-serif">ANUL METHNULA</text>

    <text x="0" y="103" fill="#B8C4D6" font-size="17" font-weight="600" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1">BUSINESS ANALYSIS • PROJECT MANAGEMENT</text>

    <text x="0" y="126" fill="#7F8EA3" font-size="12" font-weight="600" font-family="Consolas, monospace" letter-spacing="2">AGILE • PROCESS IMPROVEMENT • DIGITAL TRANSFORMATION</text>

    <!-- skill chips -->
    <g transform="translate(0 150)">
      <rect x="0" y="0" width="126" height="34" rx="17" fill="#082923" stroke="#2DD4BF"/>
      <text x="63" y="22" text-anchor="middle" fill="#5EEAD4" font-size="11" font-weight="700" font-family="Segoe UI, Arial, sans-serif">REQUIREMENTS</text>

      <rect x="138" y="0" width="118" height="34" rx="17" fill="#101E38" stroke="#3B82F6"/>
      <text x="197" y="22" text-anchor="middle" fill="#93C5FD" font-size="11" font-weight="700" font-family="Segoe UI, Arial, sans-serif">STAKEHOLDERS</text>

      <rect x="268" y="0" width="92" height="34" rx="17" fill="#211633" stroke="#8B5CF6"/>
      <text x="314" y="22" text-anchor="middle" fill="#C4B5FD" font-size="11" font-weight="700" font-family="Segoe UI, Arial, sans-serif">AGILE</text>

      <rect x="372" y="0" width="92" height="34" rx="17" fill="#31200D" stroke="#F59E0B"/>
      <text x="418" y="22" text-anchor="middle" fill="#FCD34D" font-size="11" font-weight="700" font-family="Segoe UI, Arial, sans-serif">BPMN</text>
    </g>

    <g transform="translate(0 222)">
      <circle cx="5" cy="0" r="5" fill="#22C55E">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="5" fill="#91A4BD" font-size="12.5" font-family="Consolas, monospace">clarity • coordination • delivery • improvement</text>
      <rect x="333" y="-10" width="7" height="18" rx="1" fill="#2DD4BF">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Right project dashboard -->
  <g transform="translate(748 105)">
    <rect x="0" y="0" width="390" height="238" rx="22" fill="#0D141D" stroke="#334155"/>

    <text x="24" y="31" fill="#E2E8F0" font-size="14" font-weight="700" font-family="Segoe UI, Arial, sans-serif">PROJECT DELIVERY BOARD</text>
    <text x="24" y="51" fill="#64748B" font-size="9.5" font-family="Consolas, monospace" letter-spacing="1">BA + PM WORKFLOW</text>

    <!-- lifecycle -->
    <line x1="50" y1="92" x2="330" y2="92" stroke="#334155" stroke-width="3"/>
    <line x1="50" y1="92" x2="330" y2="92" stroke="url(#accent)" stroke-width="3" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="8s" repeatCount="indefinite"/>
    </line>

    <circle cx="50" cy="92" r="14" fill="#082923" stroke="#2DD4BF"/>
    <text x="50" y="96" text-anchor="middle" fill="#5EEAD4" font-size="10" font-weight="700" font-family="Segoe UI, Arial, sans-serif">01</text>
    <text x="50" y="119" text-anchor="middle" fill="#94A3B8" font-size="8.5" font-family="Segoe UI, Arial, sans-serif">DISCOVER</text>

    <circle cx="143" cy="92" r="14" fill="#101E38" stroke="#3B82F6"/>
    <text x="143" y="96" text-anchor="middle" fill="#93C5FD" font-size="10" font-weight="700" font-family="Segoe UI, Arial, sans-serif">02</text>
    <text x="143" y="119" text-anchor="middle" fill="#94A3B8" font-size="8.5" font-family="Segoe UI, Arial, sans-serif">DEFINE</text>

    <circle cx="236" cy="92" r="14" fill="#211633" stroke="#8B5CF6"/>
    <text x="236" y="96" text-anchor="middle" fill="#C4B5FD" font-size="10" font-weight="700" font-family="Segoe UI, Arial, sans-serif">03</text>
    <text x="236" y="119" text-anchor="middle" fill="#94A3B8" font-size="8.5" font-family="Segoe UI, Arial, sans-serif">PLAN</text>

    <circle cx="330" cy="92" r="14" fill="#142314" stroke="#22C55E"/>
    <text x="330" y="96" text-anchor="middle" fill="#86EFAC" font-size="10" font-weight="700" font-family="Segoe UI, Arial, sans-serif">04</text>
    <text x="330" y="119" text-anchor="middle" fill="#94A3B8" font-size="8.5" font-family="Segoe UI, Arial, sans-serif">DELIVER</text>

    <!-- moving active dot -->
    <circle cx="50" cy="92" r="4" fill="#FFFFFF">
      <animate attributeName="cx" values="50;143;236;330;50" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#2DD4BF;#3B82F6;#8B5CF6;#22C55E;#2DD4BF" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- status bars -->
    <text x="24" y="156" fill="#64748B" font-size="9.5" font-family="Consolas, monospace" letter-spacing="1">DELIVERY SIGNALS</text>

    <text x="24" y="181" fill="#CBD5E1" font-size="10" font-family="Segoe UI, Arial, sans-serif">Requirements</text>
    <rect x="105" y="173" width="118" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="105" y="173" width="104" height="7" rx="3.5" fill="url(#progress)">
      <animate attributeName="width" values="82;104;92;104" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="238" y="181" fill="#5EEAD4" font-size="9" font-family="Consolas, monospace">CLEAR</text>

    <text x="24" y="204" fill="#CBD5E1" font-size="10" font-family="Segoe UI, Arial, sans-serif">Stakeholders</text>
    <rect x="105" y="196" width="118" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="105" y="196" width="96" height="7" rx="3.5" fill="#8B5CF6">
      <animate attributeName="width" values="78;96;88;96" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <text x="238" y="204" fill="#C4B5FD" font-size="9" font-family="Consolas, monospace">ALIGNED</text>

    <text x="24" y="227" fill="#CBD5E1" font-size="10" font-family="Segoe UI, Arial, sans-serif">Project Health</text>
    <circle cx="111" cy="223" r="5" fill="#22C55E">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="123" y="227" fill="#86EFAC" font-size="9.5" font-weight="700" font-family="Consolas, monospace">ON TRACK</text>
  </g>

  <!-- floating mini cards -->
  <g transform="translate(708 310)">
    <animateTransform attributeName="transform" type="translate" values="708 310;708 304;708 310" dur="5s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="158" height="52" rx="14" fill="#0D141D" stroke="#334155"/>
    <text x="16" y="19" fill="#64748B" font-size="9" font-family="Consolas, monospace" letter-spacing="1">STAKEHOLDER MAP</text>
    <circle cx="22" cy="36" r="4.5" fill="#2DD4BF"/>
    <circle cx="38" cy="36" r="4.5" fill="#3B82F6"/>
    <circle cx="54" cy="36" r="4.5" fill="#8B5CF6"/>
    <circle cx="70" cy="36" r="4.5" fill="#F59E0B"/>
    <text x="87" y="40" fill="#CBD5E1" font-size="9.5" font-weight="700" font-family="Segoe UI, Arial, sans-serif">CONNECTED</text>
  </g>

  <g transform="translate(1002 310)">
    <animateTransform attributeName="transform" type="translate" values="1002 310;1007 304;1002 310" dur="6.5s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="148" height="52" rx="14" fill="#0D141D" stroke="#334155"/>
    <text x="16" y="19" fill="#64748B" font-size="9" font-family="Consolas, monospace" letter-spacing="1">NEXT MILESTONE</text>
    <text x="16" y="39" fill="#FCD34D" font-size="10" font-weight="700" font-family="Consolas, monospace">UAT → GO LIVE</text>
  </g>
</svg>
