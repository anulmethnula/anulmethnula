<rect x="1" y="1"
width="1198"
height="398"
rx="30"
fill="url(#bg)"
stroke="#263665"
stroke-width="2"/>

<rect x="22" y="22"
width="1156"
height="356"
rx="24"
fill="url(#grid)"/>

<rect x="22" y="22"
width="1156"
height="356"
rx="24"
fill="url(#glowC)"/>

<rect x="22" y="22"
