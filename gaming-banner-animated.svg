<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="Anul Methnula animated gaming profile banner">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020617"/><stop offset=".48" stop-color="#07152f"/><stop offset="1" stop-color="#12072a"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f8fafc"/><stop offset=".24" stop-color="#cbd5e1"/><stop offset=".42" stop-color="#67e8f9"/><stop offset=".72" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/>
    <animate attributeName="x1" values="0;.25;0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#a5f3fc" stop-opacity=".85"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  <radialGradient id="orb"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bigGlow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#38bdf8" stroke-opacity=".065" stroke-width="1"/></pattern>
  <clipPath id="hud"><rect x="1030" y="86" width="474" height="300" rx="24"/></clipPath>
  <clipPath id="cta"><path d="M185 388h450l36 32-36 32H185l-36-32z"/></clipPath>
</defs>

<rect width="1600" height="520" rx="28" fill="url(#bg)"/>
<rect width="1600" height="520" rx="28" fill="url(#grid)" opacity=".65"/>

<!-- ambient moving space glows -->
<circle cx="145" cy="80" r="165" fill="url(#orb)" opacity=".28" filter="url(#bigGlow)"><animate attributeName="r" values="150;185;150" dur="8s" repeatCount="indefinite"/></circle>
<circle cx="1320" cy="410" r="180" fill="#7c3aed" opacity=".08" filter="url(#bigGlow)"><animate attributeName="cx" values="1290;1350;1290" dur="10s" repeatCount="indefinite"/></circle>

<!-- cyber globe -->
<g transform="translate(72 32)" opacity=".82">
  <circle cx="122" cy="92" r="82" fill="none" stroke="#22d3ee" stroke-opacity=".24" stroke-width="2"/>
  <ellipse cx="122" cy="92" rx="82" ry="28" fill="none" stroke="#3b82f6" stroke-opacity=".35"/>
  <ellipse cx="122" cy="92" rx="38" ry="82" fill="none" stroke="#8b5cf6" stroke-opacity=".26"/>
  <ellipse cx="122" cy="92" rx="102" ry="44" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="12 12" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0 122 92" to="360 122 92" dur="18s" repeatCount="indefinite"/></ellipse>
  <g fill="#67e8f9">
    <circle cx="88" cy="59" r="3"/><circle cx="111" cy="41" r="2"/><circle cx="149" cy="55" r="3"/><circle cx="166" cy="91" r="2.5"/><circle cx="131" cy="111" r="3"/><circle cx="94" cy="126" r="2.5"/><circle cx="64" cy="89" r="2"/>
  </g>
</g>

<!-- top mini copy -->
<text x="325" y="68" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="6">IDEAS  •  ANALYSIS  •  PEOPLE  •  PROGRESS</text>
<line x1="325" y1="88" x2="930" y2="88" stroke="#22d3ee" stroke-opacity=".35"/>
<rect x="325" y="86" width="170" height="3" rx="2" fill="url(#neon)" filter="url(#glow)"><animate attributeName="x" values="325;760;325" dur="6.5s" repeatCount="indefinite"/></rect>

<!-- hero title -->
<text x="105" y="215" fill="url(#name)" font-family="Segoe UI Black,Segoe UI,Arial,sans-serif" font-size="91" font-weight="900" letter-spacing="2" filter="url(#glow)">ANUL METHNULA</text>
<text x="112" y="267" fill="#eef6ff" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">Business Analysis <tspan fill="#22d3ee">•</tspan> Project Management</text>
<text x="113" y="311" fill="#dbeafe" font-family="Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="4">AGILE  <tspan fill="#22d3ee">•</tspan>  REQUIREMENTS  <tspan fill="#22d3ee">•</tspan>  WORKFLOWS  <tspan fill="#22d3ee">•</tspan>  DIGITAL SOLUTIONS</text>

<!-- CTA gaming plate -->
<path d="M185 388h450l36 32-36 32H185l-36-32z" fill="#021b25" fill-opacity=".86" stroke="#34d399" stroke-width="2" filter="url(#glow)"/>
<g clip-path="url(#cta)"><rect x="110" y="384" width="130" height="75" fill="url(#scan)" opacity=".85"><animate attributeName="x" values="110;690;110" dur="3.4s" repeatCount="indefinite"/></rect></g>
<circle cx="225" cy="420" r="16" fill="none" stroke="#34d399" stroke-width="3"><animate attributeName="r" values="14;20;14" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="225" cy="420" r="5" fill="#34d399" filter="url(#glow)"/>
<text x="263" y="429" fill="#6ee7b7" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">OPEN TO OPPORTUNITIES</text>
<text x="595" y="430" fill="#34d399" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="900">›››</text>

<!-- horizon mountains + cyber city -->
<path d="M720 456l95-84 38 39 56-66 52 56 80-95 68 86 54-58 74 83 66-42 95 81z" fill="#071329" stroke="#155e75" stroke-width="1.5"/>
<path d="M805 456l46-36 29 20 44-32 43 26 62-44 41 22 52-36 31 19 74-48 46 29 68-32 89 56 64-36 71 72z" fill="#0a1835" opacity=".9"/>
<g fill="#0ea5e9" opacity=".72">
  <rect x="1038" y="370" width="10" height="75"/><rect x="1054" y="342" width="13" height="103"/><rect x="1074" y="383" width="9" height="62"/><rect x="1090" y="352" width="15" height="93"/><rect x="1114" y="320" width="9" height="125"/><rect x="1129" y="365" width="13" height="80"/><rect x="1150" y="335" width="8" height="110"/>
</g>

<!-- neon road -->
<path d="M730 510C905 496 979 470 1088 442c127-32 243-26 411-64" fill="none" stroke="#0f172a" stroke-width="28"/>
<path d="M730 510C905 496 979 470 1088 442c127-32 243-26 411-64" fill="none" stroke="url(#road)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="65 18"><animate attributeName="stroke-dashoffset" values="0;-166" dur="2.6s" repeatCount="indefinite"/></path>
<path d="M735 499C900 486 981 459 1084 434c129-31 239-25 408-62" fill="none" stroke="#a5f3fc" stroke-opacity=".62" stroke-width="2"/>

<!-- HUD command panel -->
<rect x="1030" y="86" width="474" height="300" rx="24" fill="#031327" fill-opacity=".87" stroke="#2563eb" stroke-opacity=".6" stroke-width="2"/>
<text x="1060" y="125" fill="#e0f2fe" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">PROJECT DELIVERY // HUD</text>
<text x="1061" y="148" fill="#60a5fa" font-family="Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="3">DISCOVER → ANALYSE → PLAN → EXECUTE → DELIVER</text>

<!-- animated scan across HUD -->
<g clip-path="url(#hud)"><rect x="980" y="87" width="120" height="298" fill="url(#scan)" opacity=".25"><animate attributeName="x" values="980;1480;980" dur="5s" repeatCount="indefinite"/></rect></g>

<!-- process nodes -->
<line x1="1084" y1="190" x2="1450" y2="190" stroke="#334155" stroke-width="4"/>
<path d="M1084 190H1450" stroke="url(#neon)" stroke-width="4" stroke-dasharray="42 324" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-366" dur="3.2s" repeatCount="indefinite"/></path>
<g font-family="Segoe UI,Arial,sans-serif" font-size="9" text-anchor="middle">
  <circle cx="1085" cy="190" r="17" fill="#062037" stroke="#22d3ee" stroke-width="2"/><text x="1085" y="194" fill="#a5f3fc">01</text><text x="1085" y="222" fill="#94a3b8">DISCOVER</text>
  <circle cx="1176" cy="190" r="17" fill="#081d3c" stroke="#3b82f6" stroke-width="2"/><text x="1176" y="194" fill="#bfdbfe">02</text><text x="1176" y="222" fill="#94a3b8">ANALYSE</text>
  <circle cx="1268" cy="190" r="17" fill="#160f3a" stroke="#8b5cf6" stroke-width="2"/><text x="1268" y="194" fill="#ddd6fe">03</text><text x="1268" y="222" fill="#94a3b8">PLAN</text>
  <circle cx="1359" cy="190" r="17" fill="#091d36" stroke="#06b6d4" stroke-width="2"/><text x="1359" y="194" fill="#cffafe">04</text><text x="1359" y="222" fill="#94a3b8">EXECUTE</text>
  <circle cx="1450" cy="190" r="17" fill="#08251e" stroke="#34d399" stroke-width="2"><animate attributeName="r" values="17;20;17" dur="2.4s" repeatCount="indefinite"/></circle><text x="1450" y="194" fill="#a7f3d0">05</text><text x="1450" y="222" fill="#94a3b8">DELIVER</text>
</g>

<!-- requirements card -->
<rect x="1060" y="248" width="134" height="104" rx="12" fill="#071a31" stroke="#164e63"/>
<text x="1075" y="271" fill="#67e8f9" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">REQUIREMENTS</text>
<g fill="none" stroke="#22d3ee" stroke-width="1.5"><rect x="1076" y="287" width="11" height="11"/><path d="M1078 292l3 3 6-8"/><rect x="1076" y="309" width="11" height="11"/><path d="M1078 314l3 3 6-8"/><rect x="1076" y="331" width="11" height="11"/><path d="M1078 336l3 3 6-8"/></g>
<g stroke="#64748b" stroke-width="3"><line x1="1096" y1="292" x2="1175" y2="292"/><line x1="1096" y1="314" x2="1162" y2="314"/><line x1="1096" y1="336" x2="1170" y2="336"/></g>

<!-- workflow card -->
<rect x="1206" y="248" width="148" height="104" rx="12" fill="#071a31" stroke="#312e81"/>
<text x="1220" y="271" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">WORKFLOWS</text>
<g><rect x="1220" y="287" width="34" height="14" rx="3" fill="#0ea5e9"/><rect x="1261" y="287" width="34" height="14" rx="3" fill="#8b5cf6"/><rect x="1302" y="287" width="34" height="14" rx="3" fill="#14b8a6"/><rect x="1220" y="309" width="34" height="14" rx="3" fill="#2563eb"/><rect x="1261" y="309" width="34" height="14" rx="3" fill="#7c3aed"/><rect x="1302" y="309" width="34" height="14" rx="3" fill="#06b6d4"/></g>

<!-- progress card -->
<rect x="1366" y="248" width="118" height="104" rx="12" fill="#071a31" stroke="#164e63"/>
<text x="1380" y="271" fill="#a7f3d0" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">PROGRESS</text>
<g stroke-linecap="round" stroke-width="8"><line x1="1382" y1="292" x2="1458" y2="292" stroke="#22d3ee"/><line x1="1382" y1="316" x2="1446" y2="316" stroke="#3b82f6"/><line x1="1382" y1="340" x2="1430" y2="340" stroke="#8b5cf6"/></g>
<g fill="#dbeafe" font-family="Segoe UI,Arial,sans-serif" font-size="9"><text x="1463" y="295">90%</text><text x="1451" y="319">75%</text><text x="1435" y="343">60%</text></g>

<!-- moving particles -->
<g fill="#67e8f9" filter="url(#glow)">
 <circle cx="300" cy="130" r="2.5"><animate attributeName="cy" values="130;112;130" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="760" cy="146" r="3"><animate attributeName="cy" values="146;126;146" dur="5.3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;.9;.2" dur="5.3s" repeatCount="indefinite"/></circle>
 <circle cx="941" cy="401" r="2.5"><animate attributeName="cy" values="401;382;401" dur="4.7s" repeatCount="indefinite"/></circle>
 <circle cx="1518" cy="90" r="3"><animate attributeName="cy" values="90;72;90" dur="5.6s" repeatCount="indefinite"/></circle>
</g>

<!-- live status -->
<circle cx="1460" cy="45" r="5" fill="#34d399" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="1474" y="50" fill="#6ee7b7" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">ACTIVE</text>

<rect x="2" y="2" width="1596" height="516" rx="26" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".18"><animate attributeName="opacity" values=".12;.35;.12" dur="3.5s" repeatCount="indefinite"/></rect>
</svg>